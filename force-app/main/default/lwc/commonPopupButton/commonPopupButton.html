<template>
    <lightning-button variant={variant} onclick={handleOnClickPopupButton} label={buttonLabel}></lightning-button>
    <template if:true={showModal}>
        <section class="slds-modal slds-fade-in-open slds-modal_small" role="dialog" onclosemodal={handleCloseModalFromChild}>
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">{buttonLabel}</h2>
                </header>
                <div class="slds-modal__content modal-content slds-p-around_medium">
                    <slot></slot>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={handleClose}></lightning-button>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
