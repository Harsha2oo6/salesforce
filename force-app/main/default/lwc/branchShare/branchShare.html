<template>
    <lightning-card title="Assign Branches" icon-name="standard:branch">
        <div class="slds-p-around_medium">
            <template lwc:if={selectedIds.length}>
                <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                    <span class="slds-assistive-text">info</span>
                    <h2>You have selected {selectedIds.length} records to assign.</h2>
                </div>

                <div class="slds-m-top_medium">
                    <p class="slds-text-title_caps">Selected Record IDs:</p>
                    <ul class="slds-list_dotted">
                        <template for:each={selectedIds} for:item="recId">
                            <li key={recId}>{recId}</li>
                        </template>
                    </ul>
                </div>
            </template>

            <template lwc:else>
                <div class="slds-text-color_error">
                    No records were selected or passed correctly.
                </div>
            </template>
        </div>

        <div slot="footer">
            <lightning-button label="De-Assign" 
                              variant="destructive"
                              onclick={handleDeassign} 
                              class="slds-m-right_small">
            </lightning-button>
            
            <lightning-button variant="brand" 
                              label="Assign" 
                              onclick={handleAssign}
                              disabled={isAssignDisabled}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
