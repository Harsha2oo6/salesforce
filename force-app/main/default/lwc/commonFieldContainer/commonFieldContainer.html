<template>
    <div class="slds-grid slds-grid_vertical-align-center responsive-field">
        <strong class="slds-m-right_small label">{formattedLabel}</strong>

        <div class="slds-text-body_small value">
            <template if:true={isBoolean}>
                <lightning-formatted-text value={formattedValue}></lightning-formatted-text>
            </template>
            <template if:false={isBoolean}>
                {formattedValue}
            </template>
        </div>
    </div>
</template>
