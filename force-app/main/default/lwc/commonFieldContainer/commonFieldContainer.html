<template>
    <div class="slds-grid slds-grid_vertical-align-center">
        <strong class="slds-m-right_small">{formattedLabel}</strong>
        <div class="slds-text-body_small">
            <template if:true={isBoolean}>
                <lightning-formatted-text value={formattedValue}></lightning-formatted-text>
            </template>
            <template if:false={isBoolean}>
                {formattedValue}
            </template>
        </div>
    </div>
</template>
