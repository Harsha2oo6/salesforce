<template>
    <div class="slds-m-bottom_medium">
        <div class="slds-box slds-box_x-small accordion-header" onclick={handleToggle} role="button" tabindex="0"
            onkeydown={handleKeyDown}>
            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <lightning-icon icon-name={iconName} alternative-text="Toggle" size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    <h3 class="slds-text-heading_small">{title}</h3>
                </div>
            </div>
        </div>

        <template if:true={isExpanded}>
            <div class="slds-box slds-box_x-small accordion-content">
                <!-- Expanded content -->
                <slot></slot>
            </div>
        </template>
    </div>
</template>
