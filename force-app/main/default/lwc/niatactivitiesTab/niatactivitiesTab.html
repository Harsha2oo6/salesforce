<template>
    <c-tabs-container tabs={tabs} active-tab-value={activeTabValue} variant="standard" ontabchange={handleTabChange}>

        <!-- Activities Tab Content -->
        <div slot="LEAD_ACTIVITY">
            <div class="slds-m-top_medium">

                <!-- Activities List -->
                <template if:true={isLoading}>
                    <c-common-loader loader-size="medium"></c-common-loader>
                </template>

                <template if:true={error}>
                    <div class="slds-box slds-box_x-small slds-theme_error slds-m-top_medium">
                        <p class="slds-text-color_error">
                            Error loading activities: {errorMessage}
                        </p>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <template if:false={error}>
                        <lightning-card>
                            <div class="slds-p-around_medium">
                                <div class="slds-m-bottom_small slds-text-align_right">
                                    <lightning-button-icon icon-name="utility:settings"
                                        alternative-text="Filter Settings" variant="border-filled" size="medium"
                                        onclick={openFilterModal} title="Filter Settings">
                                    </lightning-button-icon>
                                </div>
                                <template if:true={activitiesTabActivities.length}>
                                    <template for:each={activitiesTabActivities} for:item="activity">
                                        <c-common-accordion key={activity.id} variant="activity-item" is-collapsed-by-default="true">
                                            <!-- Trigger: Clickable activity item -->
                                            <div slot="trigger" class="slds-box slds-box_x-small activity-item">
                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                    <!-- Green circular icon with checklist -->
                                                    <div class="slds-m-right_small">
                                                        <div class="activity-icon-circle">
                                                            <lightning-icon icon-name="utility:task" 
                                                                alternative-text="Activity" 
                                                                size="small"
                                                                class="activity-icon">
                                                            </lightning-icon>
                                                        </div>
                                                    </div>
                                                    <!-- Title and info -->
                                                    <div class="slds-col slds-grow">
                                                        <a href="#" 
                                                            class="slds-text-heading_small slds-text-link" 
                                                            onclick={handleTitleClick}>
                                                            {activity.activity_name}
                                                        </a>
                                                        <template if:true={activity.task_user_name}>
                                                            <p class="slds-text-body_small slds-m-top_xx-small">
                                                                Assigned to: {activity.task_user_name}
                                                            </p>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Expanded Content: Fields using commonFieldContainer -->
                                            <div class="accordion-content-activity slds-p-around_small">
                                                <div class="slds-grid slds-grid_vertical">
                                                    <template if:true={activity.fields}>
                                                        <template for:each={activity.fields} for:item="field">
                                                            <div key={field.order} class="slds-box slds-box_x-small activity-field-item">
                                                            <c-common-field-container item={field}>
                                                            </c-common-field-container>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </div>
                                        </c-common-accordion>
                                    </template>
                                </template>
                                <template if:false={activitiesTabActivities.length}>
                                    <p class="slds-text-color_weak slds-text-align_center">No activities found</p>
                                </template>

                                <!-- Pagination -->
                                <template if:true={activitiesTabActivities.length}>
                                    <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                                        <div class="slds-text-body_small">
                                            Showing {activitiesTabPaginationDisplay.start} -
                                            {activitiesTabPaginationDisplay.end} of
                                            {activitiesTabPaginationDisplay.total}
                                        </div>
                                        <div>
                                            <template if:true={showPreviousButton}>
                                                <lightning-button label="Previous" onclick={handlePrevious}
                                                    variant="neutral">
                                                </lightning-button>
                                            </template>
                                            <template if:true={showLoadMoreButton}>
                                                <lightning-button label="Load More" onclick={handleLoadMore}
                                                    variant="brand" class={loadMoreButtonClass}>
                                                </lightning-button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </lightning-card>
                    </template>
                </template>
            </div>
        </div>

        <!-- Tasks Tab Content -->
        <div slot="TASK">
            <div class="slds-m-top_medium">

                <!-- Loading State -->
                <template if:true={isLoading}>
                    <c-common-loader loader-size="medium"></c-common-loader>
                </template>

                <!-- Error State -->
                <template if:true={error}>
                    <div class="slds-box slds-box_x-small slds-theme_error slds-m-top_medium">
                        <p class="slds-text-color_error">
                            Error loading tasks: {errorMessage}
                        </p>
                    </div>
                </template>
                <!-- Tasks List -->
                <template if:false={isLoading}>

                    <template if:false={error}>
                        <lightning-card>
                            <div class="slds-p-around_medium">
                                <div class="slds-m-bottom_small slds-text-align_right">
                                    <lightning-button-icon icon-name="utility:settings"
                                        alternative-text="Filter Settings" variant="border-filled" size="medium"
                                        onclick={openFilterModal} title="Filter Settings">
                                    </lightning-button-icon>
                                </div>
                                <template if:true={tasksTabActivities.length}>
                                    <template for:each={tasksTabActivities} for:item="activity">
                                        <c-common-accordion key={activity.id} variant="activity-item" is-collapsed-by-default="true">
                                            <!-- Trigger: Clickable activity item -->
                                            <div slot="trigger" class="slds-box slds-box_x-small activity-item">
                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                    <!-- Green circular icon with checklist -->
                                                    <div class="slds-m-right_small">
                                                        <div class="activity-icon-circle">
                                                            <lightning-icon icon-name="utility:task" 
                                                                alternative-text="Activity" 
                                                                size="small"
                                                                class="activity-icon">
                                                            </lightning-icon>
                                                        </div>
                                                    </div>
                                                    <!-- Title and info -->
                                                    <div class="slds-col slds-grow">
                                                        <a href="#" 
                                                            class="slds-text-heading_small slds-text-link" 
                                                            onclick={handleTitleClick}>
                                                            {activity.activity_name}
                                                        </a>
                                                        <template if:true={activity.task_user_name}>
                                                            <p class="slds-text-body_small slds-m-top_xx-small">
                                                                Assigned to: {activity.task_user_name}
                                                            </p>
                                                        </template>
                                                    </div>
                                                </div>
                                            </div>

                                            <!-- Expanded Content: Fields using commonFieldContainer -->
                                            <div class="accordion-content-activity slds-p-around_small">
                                                <div class="slds-grid slds-grid_vertical">
                                                    <template if:true={activity.fields}>
                                                        <template for:each={activity.fields} for:item="field">
                                                            <div key={field.order} class="slds-box slds-box_x-small activity-field-item">
                                                            <c-common-field-container item={field}>
                                                            </c-common-field-container>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </div>
                                        </c-common-accordion>
                                    </template>
                                </template>
                                <template if:false={tasksTabActivities.length}>
                                    <p class="slds-text-color_weak slds-text-align_center">No tasks found</p>
                                </template>

                                <!-- Pagination -->
                                <template if:true={tasksTabActivities.length}>
                                    <div class="slds-grid slds-grid_align-spread slds-m-top_medium">
                                        <div class="slds-text-body_small">
                                            Showing {tasksTabPaginationDisplay.start} -
                                            {tasksTabPaginationDisplay.end} of
                                            {tasksTabPaginationDisplay.total}
                                        </div>
                                        <div>
                                            <template if:true={showPreviousButton}>
                                                <lightning-button label="Previous" onclick={handlePrevious}
                                                    variant="neutral">
                                                </lightning-button>
                                            </template>
                                            <template if:true={showLoadMoreButton}>
                                                <lightning-button label="Load More" onclick={handleLoadMore}
                                                    variant="brand" class={loadMoreButtonClass}>
                                                </lightning-button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </lightning-card>
                    </template>
                </template>
            </div>
        </div>
    </c-tabs-container>

    <!-- Filter Modal -->
    <template if:true={showFilterModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium"
            aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeFilterModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Filter Settings</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6"
                            large-device-size="6">
                            <lightning-input label="From Date" type="date" value={filters.fromDate}
                                data-filter="fromDate">
                            </lightning-input>
                        </lightning-layout-item>
                        <lightning-layout-item size="12" small-device-size="12" medium-device-size="6"
                            large-device-size="6">
                            <lightning-input label="To Date" type="date" value={filters.toDate} data-filter="toDate">
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                <footer class="slds-modal__footer responsive-footer">
                    <lightning-button
                        class="footer-btn"
                        label="Clear Filters"
                        variant="neutral"
                        onclick={clearFilters}>
                    </lightning-button>
                
                    <lightning-button
                        class="footer-btn"
                        label="Apply Filters"
                        variant="brand"
                        onclick={applyFilters}>
                    </lightning-button>
                
                    <lightning-button
                        class="footer-btn"
                        label="Close"
                        variant="neutral"
                        onclick={closeFilterModal}>
                    </lightning-button>
                </footer>
                
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" onclick={handleModalBackdropClick}></div>
    </template>
</template>
